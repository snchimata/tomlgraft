name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag on main, matching package versions
        required: true
        default: v0.1.1
        type: string
      publish_github:
        description: Publish the GitHub prerelease and verified assets
        default: false
        type: boolean
      publish_crates:
        description: Publish core then CLI to crates.io
        default: false
        type: boolean
      publish_pypi:
        description: Publish wheels and source distribution to PyPI
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
env:
  RUSTUP_TOOLCHAIN: "1.97.0"
jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Validate tag, versions, notes, and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/release.py --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
  checks:
    needs: preflight
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.tag }}
  build:
    needs: checks
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: rustup toolchain install 1.97.0 --profile minimal
      - run: python -m pip install maturin==1.13.1 packaging==26.3 twine==6.2.0
      - run: cargo build --release --locked -p tomlgraft
      - name: Build audited wheels
        shell: bash
        run: python -m maturin build --release --locked --compatibility manylinux_2_35 --auditwheel check --out dist
      - name: Smoke installed wheel and build CLI archive
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          export TOMLGRAFT_CLI="$GITHUB_WORKSPACE/target/release/tomlgraft"
          if [[ "$RUNNER_OS" == Windows ]]; then export TOMLGRAFT_CLI="$TOMLGRAFT_CLI.exe"; fi
          python -m unittest discover -s tests -v
          python examples/patch.py
          python scripts/release.py --bundle target/bundles --binary "$TOMLGRAFT_CLI"
      - name: Build source packages
        if: runner.os == 'Linux'
        run: |
          cargo package --workspace --exclude tomlgraft-py --locked
          python -m maturin sdist --out dist
          python -m pip install --force-reinstall --no-cache-dir dist/tomlgraft-*.tar.gz
          TOMLGRAFT_CLI="$GITHUB_WORKSPACE/target/release/tomlgraft" python -m unittest discover -s tests -v
          python tests/check_artifacts.py
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ runner.os }}
          path: |
            dist/*
            target/bundles/*
            target/package/*.crate
          if-no-files-found: error
  assemble:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: target/downloaded
      - name: Flatten unique assets and generate checksums
        run: |
          mkdir -p target/release-artifacts
          python - <<'PY'
          from pathlib import Path
          import shutil
          for source in Path("target/downloaded").rglob("*"):
              if source.is_file():
                  target = Path("target/release-artifacts") / source.name
                  if source.is_symlink() or target.exists():
                      raise ValueError("duplicate or symlinked release artifact")
                  shutil.copyfile(source, target)
          PY
          python scripts/release.py --assemble target/release-artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-release
          path: target/release-artifacts/*
          if-no-files-found: error
  crates:
    if: inputs.publish_crates
    needs: assemble
    environment: crates-io
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: target/release-artifacts
      - name: Verify source packages against the reviewed assets
        run: |
          python scripts/release.py --verify target/release-artifacts
          cargo package --workspace --exclude tomlgraft-py --locked
          for file in target/package/*.crate; do cmp "$file" "target/release-artifacts/$(basename "$file")"; done
      - name: Publish core before CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked -p tomlgraft-core
          cargo publish --locked -p tomlgraft
  pypi:
    if: inputs.publish_pypi
    needs: assemble
    environment:
      name: pypi
      url: https://pypi.org/p/tomlgraft
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: target/release-artifacts
      - name: Verify and select Python distributions
        run: |
          python scripts/release.py --verify target/release-artifacts
          mkdir -p target/pypi
          cp target/release-artifacts/*.whl target/pypi/
          version="$(python scripts/release.py)"
          cp "target/release-artifacts/tomlgraft-${version}.tar.gz" target/pypi/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: target/pypi
  github:
    if: ${{ always() && !cancelled() && inputs.publish_github && needs.assemble.result == 'success' && (needs.crates.result == 'success' || needs.crates.result == 'skipped') && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped') }}
    needs: [assemble, crates, pypi]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: target/release-artifacts
      - name: Publish prerelease with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/release.py --verify target/release-artifacts
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "tomlgraft $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" target/release-artifacts/*
